<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Music Player</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0d0d11;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .player-container {
            width: 90%;
            max-width: 800px;
            background: rgba(20, 20, 28, 0.85);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        /* Visualizer Canvas */
        #visualizer {
            width: 100%;
            height: 180px;
            border-radius: 12px;
            background: rgba(0, 0, 0, 0.2);
        }

        /* Track Info & Controls */
        .info-panel {
            text-align: center;
        }

        .track-title {
            font-size: 1.4rem;
            font-weight: bold;
            color: #00f2fe;
            margin-bottom: 5px;
        }

        .track-artist {
            font-size: 0.9rem;
            color: #a0a0ab;
        }

        /* Progress Bar */
        .progress-container {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .time {
            font-size: 0.85rem;
            font-family: monospace;
            color: #00f2fe;
            min-width: 45px;
        }

        input[type="range"] {
            flex: 1;
            accent-color: #00f2fe;
            cursor: pointer;
        }

        /* Control Buttons */
        .controls {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .btn {
            background: none;
            border: none;
            color: #ffffff;
            font-size: 1.5rem;
            cursor: pointer;
            transition: transform 0.2s, color 0.2s;
        }

        .btn:hover {
            color: #00f2fe;
            transform: scale(1.1);
        }

        .btn-play {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            background: #00f2fe;
            color: #0d0d11;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.6rem;
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.5);
        }

        .btn-play:hover {
            color: #0d0d11;
            transform: scale(1.08);
            box-shadow: 0 0 25px rgba(0, 242, 254, 0.8);
        }

        /* Responsive Layout for Mobile */
        @media (max-width: 600px) {
            .player-container {
                padding: 20px;
                width: 95%;
            }

            #visualizer {
                height: 120px;
            }

            .track-title {
                font-size: 1.1rem;
            }

            .controls {
                gap: 15px;
            }

            .btn-play {
                width: 45px;
                height: 45px;
                font-size: 1.3rem;
            }
        }
    </style>
</head>
<body>

<div class="player-container">
    <canvas id="visualizer"></canvas>

    <div class="info-panel">
        <div class="track-title" id="title">Judul Lagu</div>
        <div class="track-artist" id="artist">Nama Artist</div>
    </div>

    <div class="progress-container">
        <span class="time" id="current-time">00:00</span>
        <input type="range" id="seek-bar" value="0" min="0" step="0.1">
        <span class="time" id="duration">00:00</span>
    </div>

    <div class="controls">
        <button class="btn" id="prev">⏮</button>
        <button class="btn btn-play" id="play-pause">▶</button>
        <button class="btn" id="next">⏭</button>
    </div>
</div>

<audio id="audio-element" src="lagu.mp3"></audio>

<script>
    const audio = document.getElementById('audio-element');
    const playBtn = document.getElementById('play-pause');
    const seekBar = document.getElementById('seek-bar');
    const currentTimeEl = document.getElementById('current-time');
    const durationEl = document.getElementById('duration');
    const canvas = document.getElementById('visualizer');
    const ctx = canvas.getContext('2d');

    let audioCtx, analyser, source, dataArray, bufferLength;
    let isInitialized = false;

    // Set canvas resolution
    function resizeCanvas() {
        canvas.width = canvas.offsetWidth;
        canvas.height = canvas.offsetHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // Inisialisasi Audio Context & Visualizer (Saat tombol play diklik pertama kali)
    function initAudio() {
        if (isInitialized) return;
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 128;
        
        source = audioCtx.createMediaElementSource(audio);
        source.connect(analyser);
        analyser.connect(audioCtx.destination);

        bufferLength = analyser.frequencyBinCount;
        dataArray = new Uint8Array(bufferLength);
        
        isInitialized = true;
        drawVisualizer();
    }

    // Fungsi Play/Pause
    playBtn.addEventListener('click', () => {
        initAudio();
        if (audioCtx && audioCtx.state === 'suspended') {
            audioCtx.resume();
        }

        if (audio.paused) {
            audio.play();
            playBtn.textContent = '⏸';
        } else {
            audio.pause();
            playBtn.textContent = '▶';
        }
    });

    // Drawing Visualizer Spectrum
    function drawVisualizer() {
        requestAnimationFrame(drawVisualizer);
        if (!analyser) return;

        analyser.getByteFrequencyData(dataArray);
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        const barWidth = (canvas.width / bufferLength) * 2;
        let x = 0;

        for (let i = 0; i < bufferLength; i++) {
            const barHeight = (dataArray[i] / 255) * canvas.height;

            // Gradient Warna Spektrum (Menyerupai Desain)
            const gradient = ctx.createLinearGradient(0, canvas.height, 0, 0);
            gradient.addColorStop(0, '#00f2fe');
            gradient.addColorStop(0.5, '#4facfe');
            gradient.addColorStop(1, '#ff007f');

            ctx.fillStyle = gradient;
            ctx.fillRect(x, canvas.height - barHeight, barWidth - 2, barHeight);

            x += barWidth;
        }
    }

    // Format Waktu MM:SS
    function formatTime(seconds) {
        const min = Math.floor(seconds / 60);
        const sec = Math.floor(seconds % 60);
        return `${min < 10 ? '0' : ''}${min}:${sec < 10 ? '0' : ''}${sec}`;
    }

    // Update Progress Bar
    audio.addEventListener('loadedmetadata', () => {
        seekBar.max = audio.duration;
        durationEl.textContent = formatTime(audio.duration);
    });

    audio.addEventListener('timeupdate', () => {
        seekBar.value = audio.currentTime;
        currentTimeEl.textContent = formatTime(audio.currentTime);
    });

    seekBar.addEventListener('input', () => {
        audio.currentTime = seekBar.value;
    });
</script>
</body>
</html>
