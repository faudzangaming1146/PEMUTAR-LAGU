<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Music Player Modern</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            cursor: default; /* Kursor kustom digunakan via canvas */
        }

        body {
            background: linear-gradient(135deg, #09090e 0%, #161626 50%, #0d0d1a 100%);
            color: #ffffff;
            font-family: 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        /* Canvas untuk Efek Bintang & Kursor */
        #star-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 9999;
        }

        /* Container & Layout */
        .container {
            width: 100%;
            max-width: 850px;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            gap: 40px;
        }

        /* Animasi Scroll (Fade In & Slide Up) */
        .scroll-anim {
            opacity: 0;
            transform: translateY(40px);
            transition: opacity 0.8s ease-out, transform 0.8s ease-out;
        }

        .scroll-anim.show {
            opacity: 1;
            transform: translateY(0);
        }

        /* Hero / Header Section */
        .header {
            text-align: center;
            padding: 20px 0;
        }

        .header h1 {
            font-size: 2.5rem;
            background: linear-gradient(90deg, #00f2fe, #4facfe, #00f2fe);
            background-size: 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: glowText 4s linear infinite;
        }

        @keyframes glowText {
            0% { background-position: 0%; }
            100% { background-position: 200%; }
        }

        /* Card Music Player Glassmorphism */
        .player-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 24px;
            padding: 30px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        #visualizer {
            width: 100%;
            height: 180px;
            border-radius: 16px;
            background: rgba(0, 0, 0, 0.3);
        }

        .info-panel {
            text-align: center;
        }

        .track-title {
            font-size: 1.4rem;
            font-weight: bold;
            color: #00f2fe;
            margin-bottom: 6px;
            text-shadow: 0 0 10px rgba(0, 242, 254, 0.3);
        }

        .track-artist {
            font-size: 0.9rem;
            color: #b0b0c2;
        }

        /* Progress Bar */
        .progress-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .time {
            font-size: 0.85rem;
            font-family: monospace;
            color: #00f2fe;
            min-width: 45px;
        }

        input[type="range"] {
            flex: 1;
            accent-color: #00f2fe;
            cursor: pointer;
        }

        /* Controls */
        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 25px;
        }

        .btn {
            background: none;
            border: none;
            color: #ffffff;
            font-size: 1.5rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn:hover {
            color: #00f2fe;
            transform: scale(1.15);
        }

        .btn.active {
            color: #00f2fe;
            text-shadow: 0 0 12px rgba(0, 242, 254, 0.9);
        }

        .btn-play {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00f2fe, #4facfe);
            color: #09090e;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.6rem;
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.4);
        }

        .btn-play:hover {
            transform: scale(1.1);
            box-shadow: 0 0 30px rgba(0, 242, 254, 0.8);
            color: #09090e;
        }

        /* Playlist */
        .playlist-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .playlist-title {
            font-size: 1.1rem;
            margin-bottom: 12px;
            color: #4facfe;
            font-weight: 600;
        }

        .playlist {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 180px;
            overflow-y: auto;
        }

        .playlist-item {
            padding: 12px 16px;
            font-size: 0.9rem;
            border-radius: 10px;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.02);
            transition: all 0.2s ease;
            display: flex;
            justify-content: space-between;
        }

        .playlist-item:hover, .playlist-item.active {
            background: rgba(0, 242, 254, 0.15);
            color: #00f2fe;
            border-left: 4px solid #00f2fe;
        }

        @media (max-width: 600px) {
            .header h1 { font-size: 1.8rem; }
            .player-card { padding: 20px; }
            #visualizer { height: 120px; }
            .btn-play { width: 48px; height: 48px; font-size: 1.3rem; }
            .controls { gap: 15px; }
        }
    </style>
</head>
<body>

<canvas id="star-canvas"></canvas>

<div class="container">
    <div class="header scroll-anim">
        <h1>✨ Modern Music Player ✨</h1>
    </div>

    <div class="player-card scroll-anim">
        <canvas id="visualizer"></canvas>

        <div class="info-panel">
            <div class="track-title" id="title">Memuat Lagu...</div>
            <div class="track-artist" id="artist">Music Player</div>
        </div>

        <div class="progress-container">
            <span class="time" id="current-time">00:00</span>
            <input type="range" id="seek-bar" value="0" min="0" step="0.1">
            <span class="time" id="duration">00:00</span>
        </div>

        <div class="controls">
            <button class="btn" id="prev">⏮</button>
            <button class="btn btn-play" id="play-pause">▶</button>
            <button class="btn" id="next">⏭</button>
            <button class="btn" id="repeat" title="Ulangi Lagu">🔁</button>
        </div>
    </div>

    <div class="playlist-card scroll-anim">
        <div class="playlist-title">🎵 Playlist Lagu</div>
        <div class="playlist" id="playlist"></div>
    </div>
</div>

<audio id="audio-element" crossorigin="anonymous"></audio>

<script>
    // ----------------------------------------------------
    // 1. DAFTAR LAGU
    // ----------------------------------------------------
    const songs = [
        {
            title: "BANANZA X SUPERNOVA V2",
            artist: "@fams.r",
            src: "lagu/bananzayQ.mp3"
        },
        {
            title: "All night",
            artist: "@fams.r",
            src: "lagu/Music 2.mp3"
        },
        {
            title: "GIMME GIMME",
            artist: "@fams.r",
            src: "lagu/Music 3.mp3"
        }
    ];

    let currentSongIndex = 0;
    let isRepeat = false;

    const audio = document.getElementById('audio-element');
    const playBtn = document.getElementById('play-pause');
    const prevBtn = document.getElementById('prev');
    const nextBtn = document.getElementById('next');
    const repeatBtn = document.getElementById('repeat');
    const seekBar = document.getElementById('seek-bar');
    const currentTimeEl = document.getElementById('current-time');
    const durationEl = document.getElementById('duration');
    const titleEl = document.getElementById('title');
    const artistEl = document.getElementById('artist');
    const playlistEl = document.getElementById('playlist');
    const canvas = document.getElementById('visualizer');
    const ctx = canvas.getContext('2d');

    let audioCtx, analyser, source, dataArray, bufferLength;
    let isInitialized = false;

    function resizeCanvas() {
        canvas.width = canvas.offsetWidth;
        canvas.height = canvas.offsetHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function renderPlaylist() {
        playlistEl.innerHTML = '';
        songs.forEach((song, index) => {
            const item = document.createElement('div');
            item.classList.add('playlist-item');
            if (index === currentSongIndex) item.classList.add('active');
            item.innerHTML = `<span>${index + 1}. ${song.title}</span><span>${song.artist}</span>`;
            item.addEventListener('click', () => {
                currentSongIndex = index;
                loadSong(currentSongIndex);
                playSong();
            });
            playlistEl.appendChild(item);
        });
    }

    function loadSong(index) {
        const song = songs[index];
        titleEl.textContent = song.title;
        artistEl.textContent = song.artist;
        audio.src = song.src;
        renderPlaylist();
    }

    function initAudio() {
        if (isInitialized) return;
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 128;
        
        source = audioCtx.createMediaElementSource(audio);
        source.connect(analyser);
        analyser.connect(audioCtx.destination);

        bufferLength = analyser.frequencyBinCount;
        dataArray = new Uint8Array(bufferLength);
        
        isInitialized = true;
        drawVisualizer();
    }

    function playSong() {
        initAudio();
        if (audioCtx && audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
        audio.play().then(() => {
            playBtn.textContent = '⏸';
        }).catch(err => console.log(err));
    }

    function pauseSong() {
        audio.pause();
        playBtn.textContent = '▶';
    }

    playBtn.addEventListener('click', () => {
        if (audio.paused) playSong();
        else pauseSong();
    });

    prevBtn.addEventListener('click', () => {
        currentSongIndex = (currentSongIndex - 1 + songs.length) % songs.length;
        loadSong(currentSongIndex);
        playSong();
    });

    nextBtn.addEventListener('click', () => {
        currentSongIndex = (currentSongIndex + 1) % songs.length;
        loadSong(currentSongIndex);
        playSong();
    });

    repeatBtn.addEventListener('click', () => {
        isRepeat = !isRepeat;
        repeatBtn.classList.toggle('active', isRepeat);
    });

    audio.addEventListener('ended', () => {
        if (isRepeat) {
            audio.currentTime = 0;
            playSong();
        } else {
            currentSongIndex = (currentSongIndex + 1) % songs.length;
            loadSong(currentSongIndex);
            playSong();
        }
    });

    function drawVisualizer() {
        requestAnimationFrame(drawVisualizer);
        if (!analyser) return;

        analyser.getByteFrequencyData(dataArray);
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        const barWidth = (canvas.width / bufferLength) * 2.2;
        let x = 0;

        for (let i = 0; i < bufferLength; i++) {
            const barHeight = (dataArray[i] / 255) * canvas.height;

            const gradient = ctx.createLinearGradient(0, canvas.height, 0, 0);
            gradient.addColorStop(0, '#00f2fe');
            gradient.addColorStop(0.5, '#4facfe');
            gradient.addColorStop(1, '#ff007f');

            ctx.fillStyle = gradient;
            ctx.fillRect(x, canvas.height - barHeight, barWidth - 2, barHeight);

            x += barWidth;
        }
    }

    function formatTime(seconds) {
        if (isNaN(seconds)) return "00:00";
        const min = Math.floor(seconds / 60);
        const sec = Math.floor(seconds % 60);
        return `${min < 10 ? '0' : ''}${min}:${sec < 10 ? '0' : ''}${sec}`;
    }

    audio.addEventListener('loadedmetadata', () => {
        seekBar.max = audio.duration;
        durationEl.textContent = formatTime(audio.duration);
    });

    audio.addEventListener('timeupdate', () => {
        seekBar.value = audio.currentTime;
        currentTimeEl.textContent = formatTime(audio.currentTime);
    });

    seekBar.addEventListener('input', () => {
        audio.currentTime = seekBar.value;
    });

    loadSong(currentSongIndex);

    // ----------------------------------------------------
    // 2. ANIMASI GESER / SCROLL (FADE IN SLIDE UP)
    // ----------------------------------------------------
    const animElements = document.querySelectorAll('.scroll-anim');

    function checkScroll() {
        const triggerBottom = window.innerHeight * 0.85;
        animElements.forEach(el => {
            const top = el.getBoundingClientRect().top;
            if (top < triggerBottom) {
                el.classList.add('show');
            }
        });
    }

    window.addEventListener('scroll', checkScroll);
    checkScroll(); // Cek langsung saat pertama kali dipanggil

    // ----------------------------------------------------
    // 3. EFEK BINTANG, KURSOR, TRAIL & TOUCH
    // ----------------------------------------------------
    const starCanvas = document.getElementById('star-canvas');
    const sCtx = starCanvas.getContext('2d');

    function resizeStarCanvas() {
        starCanvas.width = window.innerWidth;
        starCanvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeStarCanvas);
    resizeStarCanvas();

    const particles = [];
    let mouse = { x: -100, y: -100, isTouch: false };

    // Menggambar Bintang
    function drawStar(cx, cy, spikes, outerRadius, innerRadius, color, alpha = 1) {
        let rot = Math.PI / 2 * 3;
        let x = cx;
        let y = cy;
        let step = Math.PI / spikes;

        sCtx.save();
        sCtx.beginPath();
        sCtx.moveTo(cx, cy - outerRadius);

        for (let i = 0; i < spikes; i++) {
            x = cx + Math.cos(rot) * outerRadius;
            y = cy + Math.sin(rot) * outerRadius;
            sCtx.lineTo(x, y);
            rot += step;

            x = cx + Math.cos(rot) * innerRadius;
            y = cy + Math.sin(rot) * innerRadius;
            sCtx.lineTo(x, y);
            rot += step;
        }

        sCtx.lineTo(cx, cy - outerRadius);
        sCtx.closePath();
        sCtx.fillStyle = color;
        sCtx.globalAlpha = alpha;
        sCtx.shadowBlur = 12;
        sCtx.shadowColor = '#00f2fe';
        sCtx.fill();
        sCtx.restore();
    }

    // Partikel Jejak Bintang
    class StarParticle {
        constructor(x, y, isBurst = false) {
            this.x = x;
            this.y = y;
            this.size = isBurst ? Math.random() * 8 + 4 : Math.random() * 5 + 2;
            this.vx = (Math.random() - 0.5) * (isBurst ? 4 : 1.5);
            this.vy = (Math.random() - 0.5) * (isBurst ? 4 : 1.5);
            this.alpha = 1;
            this.decay = Math.random() * 0.02 + 0.015;
            this.color = Math.random() > 0.5 ? '#00f2fe' : '#ffffff';
        }

        update() {
            this.x += this.vx;
            this.y += this.vy;
            this.alpha -= this.decay;
        }

        draw() {
            if (this.alpha <= 0) return;
            drawStar(this.x, this.y, 5, this.size, this.size / 2, this.color, this.alpha);
        }
    }

    // Event Mouse (Laptop)
    window.addEventListener('mousemove', (e) => {
        mouse.x = e.clientX;
        mouse.y = e.clientY;
        mouse.isTouch = false;

        // Tambah jejak bintang di belakang mouse
        particles.push(new StarParticle(e.clientX, e.clientY));
    });

    // Event Touch (HP / Layar Sentuh)
    function handleTouch(e) {
        if (e.touches.length > 0) {
            const touch = e.touches[0];
            mouse.x = touch.clientX;
            mouse.y = touch.clientY;
            mouse.isTouch = true;

            // Munculkan percikan bintang pas disentuh
            for (let i = 0; i < 6; i++) {
                particles.push(new StarParticle(touch.clientX, touch.clientY, true));
            }
        }
    }

    window.addEventListener('touchstart', handleTouch);
    window.addEventListener('touchmove', handleTouch);

    // Loop Animasi Canvas Bintang
    function animateStars() {
        sCtx.clearRect(0, 0, starCanvas.width, starCanvas.height);

        // Update & gambar partikel jejak
        for (let i = particles.length - 1; i >= 0; i--) {
            particles[i].update();
            particles[i].draw();
            if (particles[i].alpha <= 0) {
                particles.splice(i, 1);
            }
        }

        // Gambar Bintang Utama (Kursor / Sentuhan)
        if (mouse.x > 0 && mouse.y > 0) {
            drawStar(mouse.x, mouse.y, 5, 12, 6, '#00f2fe', 1);
        }

        requestAnimationFrame(animateStars);
    }

    animateStars();
</script>
</body>
</html>
